<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KUNGFU</title>
  <link rel="stylesheet" href="kungf.css">
</head>
<body>

  <div class="scene">
    <img src="kungimg/background.jpg" class="bg" alt="background">

    <div class="title">功夫</div>

    <img src="kungimg/handstand.png" class="grandma" alt="grandma">

    <div class="ball-wrapper" id="ball">
      <a href="kungf2.html" >
        <img src="kungimg/ball.png" alt="Kung-fu soccer">
      </a>
      <span class="ball-label">Kung-fu soccer</span>
    </div>

    <div class="figures-track">
      <div class="figures-belt">
        <img src="kungimg/1.png" alt=""><img src="kungimg/2.png" alt=""><img src="kungimg/3.png" alt="">
        <img src="kungimg/4.png" alt=""><img src="kungimg/5.png" alt=""><img src="kungimg/6.png" alt="">
        <img src="kungimg/7.png" alt=""><img src="kungimg/8.png" alt=""><img src="kungimg/9.png" alt="">
        <img src="kungimg/1.png" alt=""><img src="kungimg/2.png" alt=""><img src="kungimg/3.png" alt="">
        <img src="kungimg/4.png" alt=""><img src="kungimg/5.png" alt=""><img src="kungimg/6.png" alt="">
        <img src="kungimg/7.png" alt=""><img src="kungimg/8.png" alt=""><img src="kungimg/9.png" alt="">
      </div>
    </div>
  </div>

  <script>
    const ball = document.getElementById('ball');

    let x = window.innerWidth * 0.7;
    let y = window.innerHeight * 0.3;
    let dx = 3;
    let dy = 2.5;

    function animate() {
      const bw = ball.offsetWidth;
      const bh = ball.offsetHeight;

      x += dx;
      y += dy;

      if (x <= 0)              { x = 0;                        dx = Math.abs(dx); }
      if (x + bw >= window.innerWidth)  { x = window.innerWidth - bw;  dx = -Math.abs(dx); }
      if (y <= 0)              { y = 0;                        dy = Math.abs(dy); }
      if (y + bh >= window.innerHeight) { y = window.innerHeight - bh; dy = -Math.abs(dy); }

      ball.style.left = x + 'px';
      ball.style.top  = y + 'px';

      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
